# =============================================================================
# SpiceXplorer — full live-SPICE stack (FastAPI backend + Next.js frontend).
#
#   cp .env.example .env      # then edit if you want a custom mount / ports
#   docker compose up --build
#   open http://localhost:4000
#
# The backend image bundles ngspice + the IHP ihp-sg13g2 PDK, so live SPICE
# works out of the box on x86-64 — no host install needed. All knobs below are
# overridable via .env (docker compose loads it automatically); the defaults
# give a working stack with no .env at all.
# =============================================================================
name: spicexplorer

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        # Set true (here or via INSTALL_AGENTS in .env) once the LLM-agent layer
        # lands, to install the `agents` dependency extra into the image.
        INSTALL_AGENTS: ${INSTALL_AGENTS:-false}
    image: spicexplorer-backend
    # The vendored OSDI compact models (docker/pdk/.../osdi/*.osdi) are x86-64.
    # Pinning amd64 makes the backend run natively on x86-64 Linux and under
    # emulation on Apple-silicon/arm64 (Docker Desktop ships the emulator), so
    # live SPICE works everywhere with the bundled models. To run natively on
    # arm64 you must supply arm64 OSDI (see docker/pdk/README.md) and override
    # this to linux/arm64 via BACKEND_PLATFORM in .env.
    platform: ${BACKEND_PLATFORM:-linux/amd64}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_PORT: 8000
      # Align in-container file ownership to the host user (Linux bind mounts).
      HOST_UID: ${UID:-1000}
      HOST_GID: ${GID:-1000}
      # --- LLM API keys (optional; consumed once the agent layer is added) -----
      # Passed through from your .env; blank if unset. Never baked into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      # Your work drive — put project YAMLs/netlists here and point a run's
      # ws_root at /work to persist outputs to the host. Customize via WORKDIR.
      - ${WORKDIR:-./work}:/work
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js rewrite at build time; the internal compose
        # service URL for the backend (do not point this at localhost).
        BACKEND_URL: http://backend:8000
    image: spicexplorer-frontend
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 4000
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    depends_on:
      - backend
    restart: unless-stopped
