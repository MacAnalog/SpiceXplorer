[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SpiceXplorer"
version = "0.1.0"
description = "A Pythonic compilation of circuit optimization algorithms with OOP emphasis for accelerated EDA research"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Danial, Noori Zadeh", email = "noorizad@mcmaster.ca"}
]
requires-python = ">=3.10"
dependencies = [
    "control>=0.10",
    "dacite>=1.9",
    "nevergrad>=1.0",
    "numpy>=2.2",
    "pandas>=2.2.3",
    "plotly>=6.0",
    "PyYAML>=6.0.1",
    "spicelib>=1.4",
    "sympy>=1.13.3",
    "torch>=2.6",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
ax = [
    "ax-platform>=1.2.4; python_version >= '3.11'",
]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
# LLM-agent layer (placeholder — populate when the agent subsystem lands).
# API keys are supplied at runtime via the environment (see .env.example),
# never baked into the image. Installed in the container when the
# INSTALL_AGENTS build arg is true (docker/Dockerfile.backend).
agents = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    # "openai>=1.0",
    # "langgraph>=0.2",
]

# [project.scripts]
# run-symbolix = "spicexplorer.symbolic_solver.main:main"

# --- Torch: CPU-only wheels on Linux ------------------------------------------
# This project uses no CUDA, so on Linux we pull torch from the PyTorch CPU
# index instead of the default PyPI wheels (which drag in the multi-GB NVIDIA
# CUDA stack). This shrinks both the Docker image and the local Linux venv.
# macOS/Windows fall through to the normal PyPI wheels.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not slow'"
markers = [
    "slow: marks tests that run a real SPICE simulation (deselect with -m 'not slow')",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs",
]
